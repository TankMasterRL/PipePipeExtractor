// The :mcp-server module exposes PipePipeExtractor's public API as an MCP
// (Model Context Protocol) server. It only depends on the compiled :extractor
// bytecode and hosts the MCP HTTP transports in an embedded Jetty container.
//
// The root build applies 'java-library' (Java 25 toolchain) to all projects and
// disables the 'test'/'check' tasks globally; this module adds the 'application'
// plugin and re-enables 'test' (like :extractor does).

apply plugin: 'application'

application {
    mainClass = 'org.schabi.newpipe.mcp.NewPipeMcpServer'
}

dependencies {
    implementation project(':extractor')

    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.0'
    implementation 'org.eclipse.jetty:jetty-server:12.0.16'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.16'

    // okhttp is required so the Downloader can back CancellableCall with a real
    // okhttp3.Call (the extractor's async request paths call await()/cancel() on it).
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

tasks.named('test') {
    enabled = true
    group = 'verification'
    useJUnitPlatform()
}
